# Install into nginx's http context; set RAG_PUBLIC_ORIGIN=https://rag.example.internal.
map $uri $asset_cache_control {
    default "no-cache";
    ~^/(api|health)/ "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}
server {
    listen 443 ssl;
    server_name rag.example.internal;
    ssl_certificate /etc/ssl/rag.crt;
    ssl_certificate_key /etc/ssl/rag.key;
    client_max_body_size 201m;
    root /opt/local-rag/client/dist;
    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control $asset_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
    location = /_client/health { access_log off; default_type application/json; return 200 '{"live":true}'; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
    location /health/ { proxy_pass http://127.0.0.1:3210; proxy_set_header Host $http_host; }
    location /api/ {
        error_page 502 504 = @api_unavailable;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        proxy_send_timeout 90s;
    }
    location @api_unavailable {
        default_type application/json;
        return 502 '{"error":{"code":"SERVER_UNAVAILABLE","message":"The application server is unavailable. Try reconnecting.","diagnostic":"$request_id"}}';
    }
}
